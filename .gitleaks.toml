# .gitleaks.toml
# Gitleaks configuration for Thriving Skills codebase
# Excludes verified mock-only test files and non-secret WooCommerce/doc examples.

[allowlist]
description = "Scoped allowlist for test fixtures and documentation"
paths = [
  '''^src/__tests__/checkoutHelpers\.test\.ts$''',
  '''^src/__tests__/PaymentModal\.test\.tsx$''',
  '''^src/__tests__/authService\.test\.ts$''',
  '''^src/__tests__/sessionLifecycle\.test\.tsx$''',
  '''^docs/''',
  '''^TECH_STACK_ANALYSIS\.md$''',
  '''^README\.md$''',
]

regexes = [
  '''wc_order_[a-zA-Z0-9_]+''',
  '''orderKey:\s*['"][a-zA-Z0-9_]+['"]''',
]
