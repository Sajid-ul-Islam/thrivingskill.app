name: Production Quality Gate (CI)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality, Typecheck & Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation (0 Errors Allowed)
        run: npm run typecheck

      - name: Codebase Import & Timer Audit
        run: npm run audit

      - name: Run Automated Test Suites
        run: npm test

      - name: Validate Expo Config & Metro Bundle Export Dry-Run
        run: npm run build:dry-run
