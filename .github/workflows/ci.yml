name: Production Quality Gate (CI)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Lint, Typecheck, Tests, Security & PHP Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup PHP 8.3, Composer & PHPCS
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: phpcs, composer
          coverage: none

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scan (Gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.2
          GITLEAKS_SHA256=fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --redact

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint Check
        run: npm run lint

      - name: Prettier Format Check
        run: npm run format:check

      - name: Strict TypeScript Compilation (0 Errors Allowed)
        run: npm run typecheck

      - name: Codebase Import & Timer Audit
        run: npm run audit

      - name: WordPress Plugin PHP Syntax, Coding Standards & PHPUnit Tests
        run: |
          find backend-plugin -name '*.php' -not -path 'backend-plugin/vendor/*' -print0 | xargs -0 -n1 php -l
          phpcs --standard=backend-plugin/phpcs.xml backend-plugin/ts-mobile-bridge
          composer install --working-dir=backend-plugin --no-interaction --no-progress
          backend-plugin/vendor/bin/phpunit -c backend-plugin/phpunit.xml.dist

      - name: Package WordPress Companion Plugin ZIP
        run: python3 scripts/package_plugin.py

      - name: Upload WordPress Plugin Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ts-mobile-bridge-plugin
          path: backend-plugin/ts-mobile-bridge.zip

      - name: Run Jest Unit & Component Tests with Coverage (Offline)
        env:
          CI: 'true'
        run: npm run test:coverage

      - name: Publish Coverage Summary to Step Summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
            const lines = [
              "## Jest Coverage Report",
              "",
              "| Metric | Covered | Total | Percentage |",
              "| --- | ---: | ---: | ---: |",
              `| Statements | ${summary.statements.covered} | ${summary.statements.total} | ${summary.statements.pct}% |`,
              `| Branches | ${summary.branches.covered} | ${summary.branches.total} | ${summary.branches.pct}% |`,
              `| Functions | ${summary.functions.covered} | ${summary.functions.total} | ${summary.functions.pct}% |`,
              `| Lines | ${summary.lines.covered} | ${summary.lines.total} | ${summary.lines.pct}% |`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Comment Coverage Report on Pull Request
        if: github.event_name == 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const body = [
              '<!-- jest-coverage-report -->',
              '### Jest Coverage Report (No Live Production Calls)',
              '',
              '| Metric | Covered | Total | Percentage |',
              '| --- | ---: | ---: | ---: |',
              `| Statements | ${summary.statements.covered} | ${summary.statements.total} | **${summary.statements.pct}%** |`,
              `| Branches | ${summary.branches.covered} | ${summary.branches.total} | **${summary.branches.pct}%** |`,
              `| Functions | ${summary.functions.covered} | ${summary.functions.total} | **${summary.functions.pct}%** |`,
              `| Lines | ${summary.lines.covered} | ${summary.lines.total} | **${summary.lines.pct}%** |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes('<!-- jest-coverage-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload Coverage Artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-coverage
          path: coverage/

      - name: Expo Prebuild (Generate Native Android Manifest & Config)
        run: npx expo prebuild --platform android --no-install

      - name: Run Offline Structural & Security Checks
        env:
          CI: 'true'
        run: npm run test:structural

      - name: Validate Expo Config & Metro Bundle Export Dry-Run
        run: npm run build:dry-run

  wp-integration:
    name: WordPress + LearnPress + WooCommerce Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3 & Extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, json, mbstring, zip, intl
          tools: composer
          coverage: none

      - name: Install PHPUnit & Polyfills
        run: composer install --working-dir=backend-plugin --no-interaction --no-progress

      - name: Install Real WordPress + LearnPress + WooCommerce Test Environment
        run: bash backend-plugin/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run WordPress Integration Test Suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
          WP_PLUGINS_DIR: /tmp/wordpress/wp-content/plugins
        run: backend-plugin/vendor/bin/phpunit -c backend-plugin/phpunit.integration.xml.dist
