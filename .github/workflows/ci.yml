name: Production Quality Gate (CI)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Lint, Typecheck, Tests, Security & PHP Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup PHP 8.3 & PHPCS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: phpcs
          coverage: none

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scan (Gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint Check
        run: npm run lint

      - name: Prettier Format Check
        run: npm run format:check

      - name: Strict TypeScript Compilation (0 Errors Allowed)
        run: npm run typecheck

      - name: Codebase Import & Timer Audit
        run: npm run audit

      - name: WordPress Plugin PHP Syntax & Coding Standards (php -l / phpcs)
        run: |
          find backend-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
          phpcs --standard=backend-plugin/phpcs.xml backend-plugin

      - name: Run Jest Unit & Component Tests with Coverage (Offline)
        env:
          CI: 'true'
        run: npm run test:coverage

      - name: Publish Coverage Summary to Step Summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
            const lines = [
              "## Jest Coverage Report",
              "",
              "| Metric | Covered | Total | Percentage |",
              "| --- | ---: | ---: | ---: |",
              `| Statements | ${summary.statements.covered} | ${summary.statements.total} | ${summary.statements.pct}% |`,
              `| Branches | ${summary.branches.covered} | ${summary.branches.total} | ${summary.branches.pct}% |`,
              `| Functions | ${summary.functions.covered} | ${summary.functions.total} | ${summary.functions.pct}% |`,
              `| Lines | ${summary.lines.covered} | ${summary.lines.total} | ${summary.lines.pct}% |`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Comment Coverage Report on Pull Request
        if: github.event_name == 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const body = [
              '<!-- jest-coverage-report -->',
              '### Jest Coverage Report (No Live Production Calls)',
              '',
              '| Metric | Covered | Total | Percentage |',
              '| --- | ---: | ---: | ---: |',
              `| Statements | ${summary.statements.covered} | ${summary.statements.total} | **${summary.statements.pct}%** |`,
              `| Branches | ${summary.branches.covered} | ${summary.branches.total} | **${summary.branches.pct}%** |`,
              `| Functions | ${summary.functions.covered} | ${summary.functions.total} | **${summary.functions.pct}%** |`,
              `| Lines | ${summary.lines.covered} | ${summary.lines.total} | **${summary.lines.pct}%** |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes('<!-- jest-coverage-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload Coverage Artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/

      - name: Run Offline Structural & Security Checks
        env:
          CI: 'true'
        run: npm run test:structural

      - name: Validate Expo Config & Metro Bundle Export Dry-Run
        run: npm run build:dry-run
