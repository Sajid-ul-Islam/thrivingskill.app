name: Deploy WordPress Companion Plugin

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target WordPress environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_parity_check:
        description: 'Run Layer 2 read-only companion parity check after activation'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: deploy-plugin-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-plugin:
    name: Package & Deploy ts-mobile-bridge (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Package ts-mobile-bridge.zip
        run: python3 scripts/package_plugin.py

      - name: Validate SSH deployment secrets
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_SITE_PATH: ${{ secrets.WP_SITE_PATH }}
        run: |
          if [ -z "$WP_SSH_HOST" ] || [ -z "$WP_SSH_USER" ] || [ -z "$WP_SSH_PRIVATE_KEY" ] || [ -z "$WP_SITE_PATH" ]; then
            echo "::error::Missing required environment secrets (WP_SSH_HOST, WP_SSH_USER, WP_SSH_PRIVATE_KEY, WP_SITE_PATH)."
            exit 1
          fi

      - name: Upload & Activate via WP-CLI over SSH
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT || '22' }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_SITE_PATH: ${{ secrets.WP_SITE_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$WP_SSH_PORT" "$WP_SSH_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key -P "$WP_SSH_PORT" backend-plugin/ts-mobile-bridge.zip "${WP_SSH_USER}@${WP_SSH_HOST}:/tmp/ts-mobile-bridge.zip"
          ssh -i ~/.ssh/deploy_key -p "$WP_SSH_PORT" "${WP_SSH_USER}@${WP_SSH_HOST}" \
            "wp plugin install /tmp/ts-mobile-bridge.zip --activate --force --path='${WP_SITE_PATH}' && rm -f /tmp/ts-mobile-bridge.zip"
          rm -f ~/.ssh/deploy_key

      - name: Setup Node.js 22 for Parity Check
        if: ${{ inputs.run_parity_check == true }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Run Layer 2 Companion Parity Verification
        if: ${{ inputs.run_parity_check == true }}
        env:
          TARGET_URL: ${{ inputs.environment == 'production' && 'https://thrivingskill.com' || 'https://staging.thrivingskill.com' }}
        run: |
          npm ci
          node scripts/test_layer2_staging_integration.js --base-url "$TARGET_URL" --strict-companion
