name: EAS Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (preview or production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-release-gate:
    name: Release Gate — Version Parity, Companion Plugin & Staging E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Enforce Release Version & Tag Parity
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/sync_version.js --check --tag "${GITHUB_REF_NAME}"
          else
            npm run version:check
          fi

      - name: Verify Expected Staging Plugin Version, v1.3 Endpoints & Authenticated E2E
        env:
          STAGING_BASE_URL: https://staging.thrivingskill.com
          STAGING_TEST_USERNAME: ${{ secrets.STAGING_TEST_USERNAME }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_JOURNEY_COURSE_ID: ${{ secrets.STAGING_JOURNEY_COURSE_ID }}
        run: node scripts/test_layer2_staging_integration.js --strict-companion --journey

  eas-android:
    name: EAS Android Build
    needs: staging-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Trigger EAS Android Build
        env:
          BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || github.event.inputs.profile || 'preview' }}
        run: eas build --platform android --profile "$BUILD_PROFILE" --non-interactive --no-wait
