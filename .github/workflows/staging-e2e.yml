name: Layer 2 — Staging Integration & E2E Journey

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 03:00 UTC health verification
  workflow_dispatch:
    inputs:
      run_journey:
        description: 'Run authenticated course enrollment -> lesson -> review -> certificate journey'
        required: false
        default: 'true'
        type: boolean
      strict_companion:
        description: 'Fail if ts-mobile-bridge plugin version or any v1.2/v1.3 route is missing on Staging'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-integration:
    name: Staging Backend Integration & E2E Journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (for version & runtime verification)
        run: npm ci

      - name: Enforce Release Version & Tag Parity
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/sync_version.js --check --tag "${GITHUB_REF_NAME}"
          else
            npm run version:check
          fi

      - name: Run Layer 2 Staging Integration & Journey Checks
        env:
          STAGING_BASE_URL: https://staging.thrivingskill.com
          STAGING_TEST_USERNAME: ${{ secrets.STAGING_TEST_USERNAME }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_JOURNEY_COURSE_ID: ${{ secrets.STAGING_JOURNEY_COURSE_ID }}
        run: |
          ARGS=""
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "${{ inputs.strict_companion }}" != "false" ]; then
            ARGS="$ARGS --strict-companion"
          fi
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "${{ inputs.run_journey }}" != "false" ]; then
            ARGS="$ARGS --journey"
          fi
          node scripts/test_layer2_staging_integration.js $ARGS
